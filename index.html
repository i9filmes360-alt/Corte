<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wellcon • ESC A2212 MQTT • dengue_bpa6tfor</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #10192b 0%, #050505 75%);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5dvh, 12px);
    }

    /* Chassi 3D Responsivo para caber em tela única sem rolagem */
    .console {
      width: 100%;
      max-width: 400px;
      max-height: calc(100dvh - clamp(12px, 3dvh, 24px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(5px, 1dvh, 9px);
      background: linear-gradient(160deg, #1a2740 0%, #0e1626 48%, #080d17 100%);
      border: 1px solid #2b4570;
      border-top-color: #466ba6;
      border-left-color: #36568a;
      border-radius: 20px;
      padding: clamp(9px, 1.5dvh, 13px);
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.92),
        0 5px 0 #04070d,
        inset 0 1px 1px rgba(255, 255, 255, 0.16),
        inset 0 -3px 8px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(5px, 0.8dvh, 8px) 10px;
      border-radius: 11px;
      background: linear-gradient(180deg, #16233b 0%, #0c1424 100%);
      border: 1px solid #233d63;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: clamp(15px, 2.3dvh, 17px);
      font-weight: 900;
      letter-spacing: 0.3px;
      color: #e63946;
      text-shadow: 0 2px 6px rgba(230, 57, 70, 0.45);
      line-height: 1.05;
    }
    .title {
      font-size: clamp(8.5px, 1.2dvh, 9.5px);
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-top: 1px;
    }
    .badge {
      font-size: clamp(9px, 1.3dvh, 10px);
      padding: 4px 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid #60a5fa;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow:
        0 3px 8px rgba(29, 78, 216, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .badge.cal-on {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow:
        0 3px 10px rgba(220, 38, 38, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* Barra MQTT */
    .mqtt-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(9.5px, 1.35dvh, 10.5px);
      font-family: monospace;
      background: #04070d;
      border: 1px solid #1e3252;
      border-bottom-color: #2f4d7a;
      border-radius: 8px;
      padding: clamp(4px, 0.65dvh, 6px) 9px;
      color: #cbd5e1;
      box-shadow:
        inset 0 3px 7px rgba(0, 0, 0, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }
    .conn-ok {
      color: #38bdf8;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    .conn-off {
      color: #f87171;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(248, 113, 113, 0.45);
    }

    /* Displays Digitais 3D embutidos */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .bezel-3d {
      background: linear-gradient(145deg, #0b1220, #192842);
      padding: 3px;
      border-radius: 13px;
      border: 1px solid #2c4875;
      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .rpm-display, .temp-display {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0a1628 0%, #03060c 90%);
      border: 1.5px solid #1e3a63;
      border-radius: 10px;
      padding: clamp(6px, 1dvh, 9px) 6px;
      text-align: center;
      box-shadow:
        inset 0 5px 12px rgba(0, 0, 0, 0.95),
        inset 0 -2px 6px rgba(37, 99, 235, 0.25);
    }
    .rpm-display::before, .temp-display::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
      pointer-events: none;
    }
    .temp-display.alert {
      background: radial-gradient(circle at 50% 35%, #2a0a10 0%, #090305 90%);
      border-color: #dc2626;
      box-shadow:
        inset 0 5px 12px rgba(0, 0, 0, 0.95),
        inset 0 0 14px rgba(220, 38, 38, 0.45);
    }
    .rpm-label {
      font-size: clamp(8.5px, 1.2dvh, 9.5px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #94a3b8;
    }
    .rpm-value {
      font-family: 'Courier New', monospace;
      font-size: clamp(22px, 3.5dvh, 28px);
      font-weight: 900;
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(59, 130, 246, 0.75),
        0 2px 3px rgba(0, 0, 0, 0.95);
      line-height: 1.1;
      margin-top: 2px;
    }
    .temp-value {
      font-family: 'Courier New', monospace;
      font-size: clamp(22px, 3.5dvh, 28px);
      font-weight: 900;
      color: #60a5fa;
      text-shadow:
        0 0 12px rgba(96, 165, 250, 0.75),
        0 2px 3px rgba(0, 0, 0, 0.95);
      line-height: 1.1;
      margin-top: 2px;
    }
    .temp-display.alert .temp-value {
      color: #ff5c67;
      text-shadow:
        0 0 14px rgba(239, 68, 68, 0.9),
        0 2px 3px rgba(0, 0, 0, 0.95);
    }
    .sub-readout {
      font-size: clamp(8.5px, 1.2dvh, 9.5px);
      font-family: monospace;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Módulo de Corte Térmico com LED Virtual 3D */
    .temp-ctrl-box {
      background: linear-gradient(180deg, #132038 0%, #0b1322 100%);
      border: 1px solid #264069;
      border-top-color: #3a5f99;
      border-radius: 12px;
      padding: clamp(6px, 0.9dvh, 9px) 9px;
      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .temp-ctrl-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(10px, 1.4dvh, 11px);
      font-weight: 700;
      margin-bottom: clamp(4px, 0.7dvh, 6px);
      color: #e2e8f0;
      gap: 8px;
    }
    .led-housing {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, #070d17, #253d63);
      border: 1px solid #35578c;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.9),
        0 2px 5px rgba(0, 0, 0, 0.65);
      flex-shrink: 0;
    }
    .virtual-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #334155 0%, #0f172a 70%, #05080f 100%);
      border: 1px solid #1e293b;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }
    .virtual-led.on {
      background: radial-gradient(circle at 35% 30%, #ffb3b8 0%, #ef4444 45%, #991b1b 90%);
      border-color: #fca5a5;
      box-shadow:
        0 0 8px #ef4444,
        0 0 16px rgba(239, 68, 68, 0.85),
        inset 0 1px 2px rgba(255, 255, 255, 0.65);
    }

    .temp-input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }
    .temp-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #04070d;
      border: 1px solid #1e3252;
      border-bottom-color: #34568a;
      border-radius: 8px;
      padding: 3px 8px;
      flex: 1;
      box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.92);
    }
    .temp-input-wrap input[type="number"] {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: clamp(14px, 2dvh, 16px);
      font-weight: 800;
      text-align: center;
      outline: none;
      text-shadow: 0 0 6px rgba(96, 165, 250, 0.45);
    }
    .temp-input-wrap span {
      font-family: monospace;
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 700;
    }

    /* Faixa Partida Calibrada */
    .cal-info {
      font-size: clamp(10px, 1.35dvh, 11px);
      color: #e2e8f0;
      text-align: center;
      background: #04070d;
      border: 1px solid #1e3252;
      border-bottom-color: #2f4d7a;
      border-radius: 8px;
      padding: clamp(4px, 0.65dvh, 6px) 9px;
      font-family: monospace;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.9);
      flex-shrink: 0;
    }
    .cal-info strong {
      color: #60a5fa;
      text-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
    }

    /* Mesa Mixer 3D Flexível */
    .mixer-area {
      flex: 1;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #132038 0%, #09101d 100%);
      border: 1px solid #264069;
      border-top-color: #3b6099;
      border-radius: 14px;
      padding: clamp(6px, 1dvh, 10px);
      box-shadow:
        0 7px 16px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .top-readout-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .pct-readout {
      font-family: 'Courier New', monospace;
      font-size: clamp(15px, 2.3dvh, 18px);
      font-weight: 900;
      color: #ffffff;
      background: radial-gradient(circle at 50% 30%, #163059 0%, #060d1a 90%);
      border: 1.5px solid #3b82f6;
      padding: 3px 11px;
      border-radius: 8px;
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.8);
      box-shadow:
        inset 0 3px 7px rgba(0, 0, 0, 0.85),
        0 3px 8px rgba(0, 0, 0, 0.5);
    }
    .pct-readout.cal {
      background: radial-gradient(circle at 50% 30%, #5c141b 0%, #1a0508 90%);
      border-color: #f87171;
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.85);
    }
    .direct-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #04070d;
      border: 1px solid #1e3252;
      border-bottom-color: #34568a;
      border-radius: 8px;
      padding: 2px 6px;
      box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.92);
    }
    .direct-input-group input[type="number"] {
      width: 50px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: clamp(13px, 1.9dvh, 15px);
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .direct-input-group span {
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    /* Botões táteis 3D */
    button {
      border: none;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    button:active:not(:disabled) {
      transform: translateY(2px);
    }
    .btn-go {
      padding: 5px 10px;
      font-size: clamp(10.5px, 1.5dvh, 11.5px);
      background: linear-gradient(180deg, #2563eb 0%, #173f99 100%);
      color: #ffffff;
      border: 1px solid #60a5fa;
      border-radius: 7px;
      box-shadow:
        0 3px 0 #0e2459,
        0 5px 10px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-go:active:not(:disabled) {
      box-shadow: 0 1px 0 #0e2459, 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .btn-go:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Trilho 3D cavado + Knob metálico com ranhura central */
    .fader-wrapper {
      --fader-len: clamp(92px, 17dvh, 155px);
      position: relative;
      width: 112px;
      height: calc(var(--fader-len) + 16px);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .scale-marks {
      position: absolute;
      left: 4px;
      top: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: clamp(8.5px, 1.2dvh, 10px);
      font-family: monospace;
      color: #94a3b8;
      font-weight: 700;
      pointer-events: none;
    }
    .fader-track {
      position: relative;
      width: 16px;
      height: var(--fader-len);
      background: #03050a;
      border: 1.5px solid #284470;
      border-radius: 999px;
      overflow: hidden;
      box-shadow:
        inset 0 4px 10px rgba(0, 0, 0, 0.98),
        0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .fader-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 55%, #173266 100%);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.75);
      transition: height 0.04s linear;
    }
    .fader-fill.cal {
      background: linear-gradient(180deg, #ff757e 0%, #dc2626 55%, #7f1d1d 100%);
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
    }
    input[type="range"].vertical-fader {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      width: var(--fader-len);
      height: 56px;
      background: transparent;
      transform: rotate(-90deg);
      cursor: pointer;
      touch-action: none;
    }
    input[type="range"].vertical-fader::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 54px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #dbe4f0 42%,
        #1e3252 47%,
        #c82e37 50%,
        #1e3252 53%,
        #cbd5e1 58%,
        #f8fafc 100%);
      border: 1.5px solid #0f172a;
      box-shadow:
        0 8px 16px rgba(0, 0, 0, 0.88),
        0 2px 0 #475569,
        inset 0 1px 1px #ffffff;
    }
    input[type="range"].vertical-fader::-moz-range-thumb {
      width: 54px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #dbe4f0 42%,
        #1e3252 47%,
        #c82e37 50%,
        #1e3252 53%,
        #cbd5e1 58%,
        #f8fafc 100%);
      border: 1.5px solid #0f172a;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.88);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-cal {
      padding: clamp(7px, 1.15dvh, 10px) 8px;
      font-size: clamp(10.5px, 1.45dvh, 11.5px);
      background: linear-gradient(180deg, #274472 0%, #172a47 100%);
      color: #ffffff;
      border: 1px solid #4a74b8;
      box-shadow:
        0 3px 0 #0c1729,
        0 5px 10px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .btn-cal:active {
      box-shadow: 0 1px 0 #0c1729, 0 2px 5px rgba(0, 0, 0, 0.6);
    }
    .btn-cal.active {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow:
        0 3px 0 #570d0d,
        0 5px 12px rgba(220, 38, 38, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn-save {
      padding: clamp(7px, 1.15dvh, 10px) 8px;
      font-size: clamp(10.5px, 1.45dvh, 11.5px);
      background: linear-gradient(180deg, #2563eb 0%, #163b8c 100%);
      color: #ffffff;
      border: 1px solid #60a5fa;
      box-shadow:
        0 3px 0 #0c2152,
        0 5px 10px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }
    .btn-save:active:not(:disabled) {
      box-shadow: 0 1px 0 #0c2152, 0 2px 5px rgba(0, 0, 0, 0.6);
    }
    .btn-save:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Linha inferior dividida: Zerar/Parar + Play/Pause */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-zero {
      width: 100%;
      padding: clamp(8px, 1.3dvh, 11px) 6px;
      font-size: clamp(10.5px, 1.45dvh, 12px);
      background: linear-gradient(180deg, #e0313c 0%, #9e1922 100%);
      color: #ffffff;
      border: 1px solid #ff878e;
      box-shadow:
        0 4px 0 #590b10,
        0 8px 16px rgba(200, 46, 55, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }
    .btn-zero:active {
      box-shadow: 0 1px 0 #590b10, 0 3px 7px rgba(200, 46, 55, 0.4);
    }
    .btn-playpause {
      width: 100%;
      padding: clamp(8px, 1.3dvh, 11px) 6px;
      font-size: clamp(10.5px, 1.45dvh, 12px);
      background: linear-gradient(180deg, #2563eb 0%, #173f99 100%);
      color: #ffffff;
      border: 1px solid #60a5fa;
      box-shadow:
        0 4px 0 #0e2459,
        0 8px 16px rgba(37, 99, 235, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }
    .btn-playpause:active {
      box-shadow: 0 1px 0 #0e2459, 0 3px 7px rgba(37, 99, 235, 0.35);
    }
    .btn-playpause.paused {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow:
        0 4px 0 #570d0d,
        0 8px 16px rgba(220, 38, 38, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .status-msg {
      font-size: clamp(9px, 1.25dvh, 10.5px);
      color: #94a3b8;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="console">
    <div class="header">
      <div class="brand-group">
        <div class="brand-name">wellcon</div>
        <div class="title">A2212 • 1000KV • CONTROLE</div>
      </div>
      <div class="badge" id="modeBadge">NORMAL</div>
    </div>

    <div class="mqtt-bar">
      <span>ID: <strong>dengue_bpa6tfor</strong></span>
      <span id="mqttStatus" class="conn-off">MQTT: DESCONECTADO</span>
    </div>

    <div class="metrics-grid">
      <div class="bezel-3d">
        <div class="rpm-display">
          <div class="rpm-label">RPM</div>
          <div class="rpm-value" id="rpmVal">0</div>
          <div class="sub-readout" id="pulsoInfo">1000 µs</div>
        </div>
      </div>

      <div class="bezel-3d">
        <div class="temp-display" id="tempCard">
          <div class="rpm-label">Temperatura</div>
          <div class="temp-value" id="tempVal">--.-°C</div>
          <div class="sub-readout" id="alvoInfo">Alvo: 40.0°C (+0.5°C)</div>
        </div>
      </div>
    </div>

    <div class="temp-ctrl-box">
      <div class="temp-ctrl-top">
        <span>Corte Térmico (+0,5°C)</span>
        <span class="led-housing" title="Estado da saída térmica">
          <span class="virtual-led" id="relayLed"></span>
        </span>
      </div>
      <div class="temp-input-row">
        <div class="temp-input-wrap">
          <input type="number" id="tempAlvoInput" min="-10" max="120" step="0.5" value="40.0" aria-label="Temperatura alvo">
          <span>°C</span>
        </div>
        <button type="button" class="btn-go" id="btnApplyTemp">SALVAR °C</button>
      </div>
    </div>

    <div class="cal-info">
      Partida Calibrada: <strong id="partidaSalva">1200</strong> µs
    </div>

    <div class="mixer-area">
      <div class="top-readout-row">
        <div class="pct-readout" id="pctVal">0%</div>
        <div class="direct-input-group" id="directBox">
          <input type="number" id="pctInput" min="0" max="100" step="1" value="0" aria-label="Porcentagem direta">
          <span>%</span>
          <button type="button" class="btn-go" id="btnApplyPct">IR</button>
        </div>
      </div>

      <div class="fader-wrapper">
        <div class="scale-marks" id="scaleMarks">
          <span>100</span>
          <span>75</span>
          <span>50</span>
          <span>25</span>
          <span>0</span>
        </div>
        <div class="fader-track">
          <div class="fader-fill" id="faderFill"></div>
        </div>
        <input type="range" min="0" max="100" value="0" class="vertical-fader" id="fader">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-cal" id="btnCal">CALIBRAR</button>
      <button class="btn-save" id="btnSave" disabled>SALVAR PARTIDA</button>
    </div>

    <div class="action-row">
      <button class="btn-zero" id="btnStop">ZERAR / PARAR (0%)</button>
      <button class="btn-playpause" id="btnPlayPause">PAUSE</button>
    </div>

    <div class="status-msg" id="statusMsg">Conectando ao broker.emqx.io...</div>
  </div>

  <script>
    const DEVICE_ID = "dengue_bpa6tfor";
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";

    // Tópicos cadastrados (mesmos do ESP32)
    const TOPIC_CMD_VEL       = "bldc/dengue_bpa6tfor/cmd/vel";
    const TOPIC_CMD_CAL_MODE  = "bldc/dengue_bpa6tfor/cmd/cal_mode";
    const TOPIC_CMD_CAL_SET   = "bldc/dengue_bpa6tfor/cmd/cal_set";
    const TOPIC_CMD_CAL_SAVE  = "bldc/dengue_bpa6tfor/cmd/cal_save";
    const TOPIC_CMD_TEMP_ALVO = "bldc/dengue_bpa6tfor/cmd/temp_alvo";
    const TOPIC_STATE         = "bldc/dengue_bpa6tfor/state";
    const TOPIC_STATUS        = "bldc/dengue_bpa6tfor/status";

    const fader = document.getElementById('fader');
    const pctVal = document.getElementById('pctVal');
    const pctInput = document.getElementById('pctInput');
    const btnApplyPct = document.getElementById('btnApplyPct');
    const directBox = document.getElementById('directBox');
    const faderFill = document.getElementById('faderFill');
    const rpmVal = document.getElementById('rpmVal');
    const pulsoInfo = document.getElementById('pulsoInfo');
    const tempCard = document.getElementById('tempCard');
    const tempVal = document.getElementById('tempVal');
    const alvoInfo = document.getElementById('alvoInfo');
    const relayLed = document.getElementById('relayLed');
    const tempAlvoInput = document.getElementById('tempAlvoInput');
    const btnApplyTemp = document.getElementById('btnApplyTemp');
    const partidaSalva = document.getElementById('partidaSalva');
    const modeBadge = document.getElementById('modeBadge');
    const scaleMarks = document.getElementById('scaleMarks');
    const btnCal = document.getElementById('btnCal');
    const btnSave = document.getElementById('btnSave');
    const btnStop = document.getElementById('btnStop');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const mqttStatus = document.getElementById('mqttStatus');
    const statusMsg = document.getElementById('statusMsg');

    let isCalibrando = false;
    let segurandoFader = false;
    let bloquearEcoLocalAte = 0;
    let bloquearTempInputAte = 0;
    let ultimoEnvio = 0;
    let pendente = null;

    // Controle Play / Pause preservando velocidade
    let estaPausado = false;
    let velocidadeMemorizada = 0;

    function sincronizarBotaoPlayPause() {
      if (estaPausado) {
        btnPlayPause.textContent = "PLAY (" + velocidadeMemorizada + "%)";
        btnPlayPause.classList.add("paused");
      } else {
        btnPlayPause.textContent = "PAUSE";
        btnPlayPause.classList.remove("paused");
      }
    }

    const clientId = "web_" + DEVICE_ID + "_" + Math.random().toString(16).slice(2, 8);
    const client = mqtt.connect(BROKER_WSS, {
      clientId: clientId,
      clean: true,
      reconnectPeriod: 3000
    });

    function pausarEcoLocal(ms = 350) {
      bloquearEcoLocalAte = Math.max(bloquearEcoLocalAte, Date.now() + ms);
    }

    function aplicarEscalaVisual(calMode, valorInicial = null) {
      isCalibrando = !!calMode;
      if (isCalibrando) {
        estaPausado = false;
        sincronizarBotaoPlayPause();
        fader.min = 1000;
        fader.max = 2000;
        pctInput.disabled = true;
        btnApplyPct.disabled = true;
        directBox.style.opacity = '0.45';
        scaleMarks.innerHTML = '<span>2000</span><span>1750</span><span>1500</span><span>1250</span><span>1000</span>';
        pctVal.classList.add('cal');
        faderFill.classList.add('cal');
        modeBadge.textContent = 'CALIBRANDO';
        modeBadge.classList.add('cal-on');
        btnCal.textContent = 'SAIR CALIB.';
        btnCal.classList.add('active');
        btnSave.disabled = false;
        statusMsg.textContent = 'Suba o fader até a hélice iniciar e clique em SALVAR PARTIDA.';
        if (valorInicial !== null) {
          atualizarVisual(valorInicial, true);
        }
      } else {
        fader.min = 0;
        fader.max = 100;
        pctInput.disabled = false;
        btnApplyPct.disabled = false;
        directBox.style.opacity = '1';
        scaleMarks.innerHTML = '<span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>';
        pctVal.classList.remove('cal');
        faderFill.classList.remove('cal');
        modeBadge.textContent = 'NORMAL';
        modeBadge.classList.remove('cal-on');
        btnCal.textContent = 'CALIBRAR';
        btnCal.classList.remove('active');
        btnSave.disabled = true;
        statusMsg.textContent = 'Sincronizado via MQTT (todos os dispositivos).';
        if (valorInicial !== null) {
          atualizarVisual(valorInicial, true);
        }
      }
    }

    function atualizarVisual(rawVal, sincronizarFader = true) {
      rawVal = parseInt(rawVal, 10) || 0;
      if (isCalibrando) {
        const clamUs = Math.max(1000, Math.min(2000, rawVal));
        pctVal.textContent = clamUs + ' µs';
        if (sincronizarFader) fader.value = clamUs;
        const pctBarra = (clamUs - 1000) / 10;
        faderFill.style.height = Math.max(0, Math.min(100, pctBarra)) + '%';
      } else {
        const clamPct = Math.max(0, Math.min(100, rawVal));
        pctVal.textContent = clamPct + '%';
        if (sincronizarFader) fader.value = clamPct;
        if (document.activeElement !== pctInput) {
          pctInput.value = clamPct;
        }
        faderFill.style.height = clamPct + '%';
      }
    }

    client.on('connect', () => {
      mqttStatus.textContent = "MQTT: ONLINE";
      mqttStatus.className = "conn-ok";
      statusMsg.textContent = "Conectado ao broker.emqx.io";
      client.subscribe([TOPIC_STATE, TOPIC_STATUS]);
    });

    client.on('reconnect', () => {
      mqttStatus.textContent = "MQTT: RECONECTANDO";
      mqttStatus.className = "conn-off";
    });

    client.on('offline', () => {
      mqttStatus.textContent = "MQTT: OFFLINE";
      mqttStatus.className = "conn-off";
    });

    client.on('message', (topic, message) => {
      const txt = message.toString();
      if (topic === TOPIC_STATUS) {
        if (txt === "offline") {
          statusMsg.textContent = "ESP32 offline no broker MQTT.";
        }
        return;
      }

      if (topic === TOPIC_STATE) {
        try {
          const d = JSON.parse(txt);
          rpmVal.textContent = d.rpm ?? 0;
          pulsoInfo.textContent = (d.pulso_us ?? 1000) + " µs";

          if (typeof d.temp === "number" && !isNaN(d.temp)) {
            tempVal.textContent = d.temp.toFixed(1) + "°C";
          } else {
            tempVal.textContent = "--.-°C";
          }

          if (typeof d.temp_alvo === "number" && !isNaN(d.temp_alvo)) {
            const limiteCorte = (d.temp_alvo + 0.5).toFixed(1);
            alvoInfo.textContent = "Alvo: " + d.temp_alvo.toFixed(1) + "°C (Corte " + limiteCorte + "°C)";
            if (document.activeElement !== tempAlvoInput && Date.now() > bloquearTempInputAte) {
              tempAlvoInput.value = d.temp_alvo.toFixed(1);
            }
          }

          const isLow = !!d.rele_low;
          if (isLow) {
            relayLed.classList.add("on");
            tempCard.classList.add("alert");
          } else {
            relayLed.classList.remove("on");
            tempCard.classList.remove("alert");
          }

          if (typeof d.partida_us === "number") {
            partidaSalva.textContent = d.partida_us;
          }

          const novoCal = !!d.cal;
          const mudouModoCal = (novoCal !== isCalibrando);
          const emInteracaoLocal = segurandoFader || (pendente !== null) || (Date.now() < bloquearEcoLocalAte);

          if (mudouModoCal && !emInteracaoLocal) {
            aplicarEscalaVisual(novoCal, novoCal ? (d.pulso_us ?? 1000) : (d.pct ?? 0));
            return;
          }

          if (!emInteracaoLocal) {
            if (isCalibrando && typeof d.pulso_us === "number") {
              atualizarVisual(d.pulso_us, true);
            } else if (!isCalibrando && typeof d.pct === "number") {
              atualizarVisual(d.pct, true);
            }
          }
        } catch (_) {}
      }
    });

    function publicar(topico, valor) {
      if (client && client.connected) {
        client.publish(topico, String(valor));
      }
    }

    function enviarControle(rawVal, forcar = false) {
      rawVal = parseInt(rawVal, 10) || 0;
      pausarEcoLocal(350);
      atualizarVisual(rawVal, false);

      const agora = Date.now();
      if (!forcar && agora - ultimoEnvio < 110) {
        pendente = rawVal;
        return;
      }
      ultimoEnvio = agora;
      pendente = null;

      if (isCalibrando) {
        publicar(TOPIC_CMD_CAL_SET, rawVal);
      } else {
        publicar(TOPIC_CMD_VEL, rawVal);
      }
    }

    setInterval(() => {
      if (pendente !== null) {
        enviarControle(pendente, true);
      }
    }, 120);

    function salvarTemperaturaAlvo() {
      let val = parseFloat(String(tempAlvoInput.value).replace(',', '.'));
      if (isNaN(val)) val = 40.0;
      val = Math.max(-10, Math.min(120, val));
      tempAlvoInput.value = val.toFixed(1);
      bloquearTempInputAte = Date.now() + 900;
      publicar(TOPIC_CMD_TEMP_ALVO, val.toFixed(1));
      statusMsg.textContent = "Temperatura alvo enviada: " + val.toFixed(1) + "°C (corte em " + (val + 0.5).toFixed(1) + "°C)";
    }

    tempAlvoInput.addEventListener('focus', () => {
      bloquearTempInputAte = Date.now() + 2000;
    });
    tempAlvoInput.addEventListener('keydown', (e) => {
      bloquearTempInputAte = Date.now() + 2000;
      if (e.key === 'Enter') {
        e.preventDefault();
        salvarTemperaturaAlvo();
        tempAlvoInput.blur();
      }
    });
    btnApplyTemp.addEventListener('click', salvarTemperaturaAlvo);

    function aplicarDigitadoPct() {
      if (isCalibrando) return;
      let v = parseInt(pctInput.value, 10);
      if (isNaN(v)) v = 0;
      v = Math.max(0, Math.min(100, v));
      estaPausado = false;
      sincronizarBotaoPlayPause();
      pctInput.value = v;
      fader.value = v;
      enviarControle(v, true);
    }

    pctInput.addEventListener('focus', () => pausarEcoLocal(1000));
    pctInput.addEventListener('keydown', (e) => {
      pausarEcoLocal(1000);
      if (e.key === 'Enter') {
        e.preventDefault();
        aplicarDigitadoPct();
        pctInput.blur();
      }
    });
    pctInput.addEventListener('change', aplicarDigitadoPct);
    btnApplyPct.addEventListener('click', aplicarDigitadoPct);

    const iniciarArraste = () => {
      segurandoFader = true;
      pausarEcoLocal(400);
    };
    const finalizarArraste = (e) => {
      segurandoFader = false;
      pausarEcoLocal(250);
      if (e && e.target) {
        if (!isCalibrando && parseInt(e.target.value, 10) > 0) {
          estaPausado = false;
          sincronizarBotaoPlayPause();
        }
        enviarControle(e.target.value, true);
      }
    };

    fader.addEventListener('pointerdown', iniciarArraste);
    fader.addEventListener('touchstart', iniciarArraste, { passive: true });
    fader.addEventListener('mousedown', iniciarArraste);

    fader.addEventListener('pointerup', finalizarArraste);
    fader.addEventListener('touchend', finalizarArraste);
    fader.addEventListener('mouseup', finalizarArraste);
    fader.addEventListener('pointercancel', finalizarArraste);

    fader.addEventListener('input', (e) => {
      segurandoFader = true;
      if (!isCalibrando && parseInt(e.target.value, 10) > 0) {
        estaPausado = false;
        sincronizarBotaoPlayPause();
      }
      enviarControle(e.target.value, false);
    });
    fader.addEventListener('change', (e) => {
      segurandoFader = false;
      if (!isCalibrando && parseInt(e.target.value, 10) > 0) {
        estaPausado = false;
        sincronizarBotaoPlayPause();
      }
      enviarControle(e.target.value, true);
    });

    btnCal.addEventListener('click', () => {
      const proximoModo = !isCalibrando;
      pausarEcoLocal(300);
      aplicarEscalaVisual(proximoModo, proximoModo ? 1000 : 0);
      publicar(TOPIC_CMD_CAL_MODE, proximoModo ? "1" : "0");
    });

    btnSave.addEventListener('click', () => {
      const usAtual = parseInt(fader.value, 10) || 1200;
      pausarEcoLocal(300);
      partidaSalva.textContent = usAtual;
      publicar(TOPIC_CMD_CAL_SAVE, usAtual);
      statusMsg.textContent = "Partida enviada para salvar em " + usAtual + " µs!";
    });

    btnStop.addEventListener('click', () => {
      segurandoFader = false;
      pendente = null;
      estaPausado = false;
      velocidadeMemorizada = 0;
      sincronizarBotaoPlayPause();
      pausarEcoLocal(250);
      if (isCalibrando) {
        atualizarVisual(1000, true);
        publicar(TOPIC_CMD_CAL_SET, 1000);
      } else {
        pctInput.value = 0;
        atualizarVisual(0, true);
        publicar(TOPIC_CMD_VEL, 0);
        statusMsg.textContent = "Zerado (0%).";
      }
    });

    btnPlayPause.addEventListener('click', () => {
      if (isCalibrando) return;
      segurandoFader = false;
      pendente = null;
      pausarEcoLocal(350);

      if (!estaPausado) {
        const atual = Math.max(0, Math.min(100, parseInt(fader.value, 10) || parseInt(pctInput.value, 10) || 0));
        if (atual === 0) {
          statusMsg.textContent = "Velocidade já está em 0% para pausar.";
          return;
        }
        velocidadeMemorizada = atual;
        estaPausado = true;
        sincronizarBotaoPlayPause();
        pctInput.value = 0;
        atualizarVisual(0, true);
        publicar(TOPIC_CMD_VEL, 0);
        statusMsg.textContent = "Pausado (0%). Velocidade salva: " + velocidadeMemorizada + "%.";
      } else {
        const alvoRetorno = velocidadeMemorizada > 0 ? velocidadeMemorizada : 0;
        estaPausado = false;
        sincronizarBotaoPlayPause();
        pctInput.value = alvoRetorno;
        atualizarVisual(alvoRetorno, true);
        publicar(TOPIC_CMD_VEL, alvoRetorno);
        statusMsg.textContent = "Retomado em " + alvoRetorno + "%.";
      }
    });
  </script>
</body>
</html>
