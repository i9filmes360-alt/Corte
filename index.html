<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESC A2212 MQTT • dengue_bpa6tfor</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .console {
      width: 100%;
      max-width: 395px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(1, 101, 254, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(1, 101, 254, 0.5);
      font-weight: 600;
    }
    .badge.cal-on {
      background: rgba(245, 158, 11, 0.22);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.6);
    }
    .mqtt-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-family: monospace;
      background: rgba(5, 5, 5, 0.65);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 12px;
    }
    .conn-ok { color: #34d399; font-weight: 700; }
    .conn-off { color: #f87171; font-weight: 700; }
    .rpm-display {
      background: #050505;
      border: 2px solid #0165FE;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: inset 0 0 18px rgba(1, 101, 254, 0.22);
    }
    .rpm-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #94a3b8;
    }
    .rpm-value {
      font-family: 'Courier New', monospace;
      font-size: 38px;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.15;
      margin-top: 2px;
    }
    .cal-info {
      font-size: 11px;
      color: #cbd5e1;
      text-align: center;
      background: rgba(5, 5, 5, 0.65);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 12px;
      font-family: monospace;
    }
    .mixer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px 12px;
      margin-bottom: 12px;
    }
    .top-readout-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .pct-readout {
      font-family: 'Courier New', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      background: #0165FE;
      padding: 4px 12px;
      border-radius: 8px;
    }
    .pct-readout.cal {
      background: #d97706;
    }
    .direct-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #050505;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 3px 6px;
    }
    .direct-input-group input[type="number"] {
      width: 58px;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .direct-input-group span {
      font-family: monospace;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 700;
    }
    .btn-go {
      padding: 6px 10px;
      font-size: 12px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 7px;
    }
    .btn-go:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .fader-wrapper {
      position: relative;
      width: 96px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .scale-marks {
      position: absolute;
      left: 6px;
      top: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 10px;
      font-family: monospace;
      color: #64748b;
      pointer-events: none;
    }
    .fader-track {
      position: relative;
      width: 14px;
      height: 196px;
      background: #050505;
      border: 1px solid #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .fader-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #38bdf8 0%, #0165FE 100%);
      transition: height 0.04s linear;
    }
    .fader-fill.cal {
      background: linear-gradient(180deg, #fcd34d 0%, #d97706 100%);
    }
    input[type="range"].vertical-fader {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      width: 196px;
      height: 54px;
      background: transparent;
      transform: rotate(-90deg);
      cursor: pointer;
      touch-action: none;
    }
    input[type="range"].vertical-fader::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 54px;
      height: 30px;
      border-radius: 6px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 48%, #64748b 52%, #e2e8f0 100%);
      border: 2px solid #0f172a;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.7), inset 0 1px 0 #ffffff;
    }
    input[type="range"].vertical-fader::-moz-range-thumb {
      width: 54px;
      height: 30px;
      border-radius: 6px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 48%, #64748b 52%, #e2e8f0 100%);
      border: 2px solid #0f172a;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.7);
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      border: none;
      border-radius: 10px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.4px;
    }
    .btn-cal {
      padding: 11px 8px;
      font-size: 12px;
      background: #2563eb;
      color: #ffffff;
    }
    .btn-cal.active {
      background: #d97706;
      color: #050505;
    }
    .btn-save {
      padding: 11px 8px;
      font-size: 12px;
      background: #059669;
      color: #ffffff;
    }
    .btn-save:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-zero {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
    }
    .btn-zero:active {
      background: #991b1b;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <div class="console">
    <div class="header">
      <div class="title">A2212 • 1000KV • 12V</div>
      <div class="badge" id="modeBadge">NORMAL</div>
    </div>

    <div class="mqtt-bar">
      <span>ID: <strong>dengue_bpa6tfor</strong></span>
      <span id="mqttStatus" class="conn-off">MQTT: DESCONECTADO</span>
    </div>

    <div class="rpm-display">
      <div class="rpm-label">RPM Média Estimada (Hélice 20cm)</div>
      <div class="rpm-value" id="rpmVal">0</div>
      <div class="rpm-label" id="pulsoInfo">Pulso: 1000 µs</div>
    </div>

    <div class="cal-info">
      Partida Calibrada: <strong id="partidaSalva">1200</strong> µs
    </div>

    <div class="mixer-area">
      <div class="top-readout-row">
        <div class="pct-readout" id="pctVal">0%</div>
        <div class="direct-input-group" id="directBox">
          <input type="number" id="pctInput" min="0" max="100" step="1" value="0" aria-label="Porcentagem direta">
          <span>%</span>
          <button type="button" class="btn-go" id="btnApplyPct">IR</button>
        </div>
      </div>

      <div class="fader-wrapper">
        <div class="scale-marks" id="scaleMarks">
          <span>100</span>
          <span>75</span>
          <span>50</span>
          <span>25</span>
          <span>0</span>
        </div>
        <div class="fader-track">
          <div class="fader-fill" id="faderFill"></div>
        </div>
        <input type="range" min="0" max="100" value="0" class="vertical-fader" id="fader">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-cal" id="btnCal">CALIBRAR</button>
      <button class="btn-save" id="btnSave" disabled>SALVAR PARTIDA</button>
    </div>
    <button class="btn-zero" id="btnStop">ZERAR / PARAR (0%)</button>
    <div class="status-msg" id="statusMsg">Conectando ao broker.emqx.io...</div>
  </div>

  <script>
    const DEVICE_ID = "dengue_bpa6tfor";
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";

    // Tópicos cadastrados (mesmos do ESP32)
    const TOPIC_CMD_VEL      = "bldc/dengue_bpa6tfor/cmd/vel";
    const TOPIC_CMD_CAL_MODE = "bldc/dengue_bpa6tfor/cmd/cal_mode";
    const TOPIC_CMD_CAL_SET  = "bldc/dengue_bpa6tfor/cmd/cal_set";
    const TOPIC_CMD_CAL_SAVE = "bldc/dengue_bpa6tfor/cmd/cal_save";
    const TOPIC_STATE        = "bldc/dengue_bpa6tfor/state";
    const TOPIC_STATUS       = "bldc/dengue_bpa6tfor/status";

    const fader = document.getElementById('fader');
    const pctVal = document.getElementById('pctVal');
    const pctInput = document.getElementById('pctInput');
    const btnApplyPct = document.getElementById('btnApplyPct');
    const directBox = document.getElementById('directBox');
    const faderFill = document.getElementById('faderFill');
    const rpmVal = document.getElementById('rpmVal');
    const pulsoInfo = document.getElementById('pulsoInfo');
    const partidaSalva = document.getElementById('partidaSalva');
    const modeBadge = document.getElementById('modeBadge');
    const scaleMarks = document.getElementById('scaleMarks');
    const btnCal = document.getElementById('btnCal');
    const btnSave = document.getElementById('btnSave');
    const btnStop = document.getElementById('btnStop');
    const mqttStatus = document.getElementById('mqttStatus');
    const statusMsg = document.getElementById('statusMsg');

    let isCalibrando = false;
    let segurandoFader = false;
    let bloquearSyncAte = 0;
    let ultimoEnvio = 0;
    let pendente = null;

    const clientId = "web_" + DEVICE_ID + "_" + Math.random().toString(16).slice(2, 8);
    const client = mqtt.connect(BROKER_WSS, {
      clientId: clientId,
      clean: true,
      reconnectPeriod: 3000
    });

    function pausarSyncTemporariamente(ms = 750) {
      bloquearSyncAte = Math.max(bloquearSyncAte, Date.now() + ms);
    }

    client.on('connect', () => {
      mqttStatus.textContent = "MQTT: ONLINE";
      mqttStatus.className = "conn-ok";
      statusMsg.textContent = "Conectado ao broker.emqx.io";
      client.subscribe([TOPIC_STATE, TOPIC_STATUS]);
    });

    client.on('reconnect', () => {
      mqttStatus.textContent = "MQTT: RECONECTANDO";
      mqttStatus.className = "conn-off";
    });

    client.on('offline', () => {
      mqttStatus.textContent = "MQTT: OFFLINE";
      mqttStatus.className = "conn-off";
    });

    client.on('message', (topic, message) => {
      const txt = message.toString();
      if (topic === TOPIC_STATUS) {
        if (txt === "offline") {
          statusMsg.textContent = "ESP32 offline no broker MQTT.";
        }
        return;
      }
      if (topic === TOPIC_STATE) {
        try {
          const d = JSON.parse(txt);
          rpmVal.textContent = d.rpm ?? 0;
          pulsoInfo.textContent = "Pulso: " + (d.pulso_us ?? 1000) + " µs";
          if (d.partida_us) {
            partidaSalva.textContent = d.partida_us;
          }

          if (typeof d.cal === "boolean" && d.cal !== isCalibrando) {
            isCalibrando = d.cal;
            configurarEscalaFader();
          }

          // Só puxa a posição do fader/input a partir do MQTT se o usuário não estiver segurando
          // e se a janela de tolerância de rede já tiver passado
          const podeSincronizar = !segurandoFader && (pendente === null) && (Date.now() > bloquearSyncAte);
          if (!isCalibrando && podeSincronizar && typeof d.pct === "number") {
            fader.value = d.pct;
            if (document.activeElement !== pctInput) {
              pctInput.value = d.pct;
            }
            pctVal.textContent = d.pct + "%";
            faderFill.style.height = d.pct + "%";
          }
        } catch (_) {}
      }
    });

    function publicar(topico, valor) {
      if (client && client.connected) {
        client.publish(topico, String(valor));
      }
    }

    function configurarEscalaFader() {
      if (isCalibrando) {
        fader.min = 1000;
        fader.max = 2000;
        fader.value = 1000;
        pctInput.value = 0;
        pctInput.disabled = true;
        btnApplyPct.disabled = true;
        directBox.style.opacity = '0.45';
        scaleMarks.innerHTML = '<span>2000</span><span>1750</span><span>1500</span><span>1250</span><span>1000</span>';
        pctVal.classList.add('cal');
        faderFill.classList.add('cal');
        modeBadge.textContent = 'CALIBRANDO';
        modeBadge.classList.add('cal-on');
        btnCal.textContent = 'SAIR CALIB.';
        btnCal.classList.add('active');
        btnSave.disabled = false;
        statusMsg.textContent = 'Suba o fader até a hélice iniciar e clique em SALVAR PARTIDA.';
        atualizarVisual(1000);
      } else {
        fader.min = 0;
        fader.max = 100;
        fader.value = 0;
        pctInput.value = 0;
        pctInput.disabled = false;
        btnApplyPct.disabled = false;
        directBox.style.opacity = '1';
        scaleMarks.innerHTML = '<span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>';
        pctVal.classList.remove('cal');
        faderFill.classList.remove('cal');
        modeBadge.textContent = 'NORMAL';
        modeBadge.classList.remove('cal-on');
        btnCal.textContent = 'CALIBRAR';
        btnCal.classList.remove('active');
        btnSave.disabled = true;
        statusMsg.textContent = 'Modo normal: digite 0–100% ou mova o fader.';
        atualizarVisual(0);
      }
    }

    function atualizarVisual(rawVal, sincronizarFader = false) {
      rawVal = parseInt(rawVal, 10) || 0;
      if (isCalibrando) {
        const clamUs = Math.max(1000, Math.min(2000, rawVal));
        pctVal.textContent = clamUs + ' µs';
        if (sincronizarFader) fader.value = clamUs;
        const pctBarra = (clamUs - 1000) / 10;
        faderFill.style.height = Math.max(0, Math.min(100, pctBarra)) + '%';
      } else {
        const clamPct = Math.max(0, Math.min(100, rawVal));
        pctVal.textContent = clamPct + '%';
        if (sincronizarFader) fader.value = clamPct;
        if (document.activeElement !== pctInput) {
          pctInput.value = clamPct;
        }
        faderFill.style.height = clamPct + '%';
      }
    }

    function enviarControle(rawVal, forcar = false) {
      rawVal = parseInt(rawVal, 10) || 0;
      pausarSyncTemporariamente(750);
      atualizarVisual(rawVal, false);

      // Intervalo menor ao arrastar (~140 ms) evita congestionar MQTT em rede lenta
      const agora = Date.now();
      if (!forcar && agora - ultimoEnvio < 140) {
        pendente = rawVal;
        return;
      }
      ultimoEnvio = agora;
      pendente = null;
      pausarSyncTemporariamente(850);

      if (isCalibrando) {
        publicar(TOPIC_CMD_CAL_SET, rawVal);
      } else {
        publicar(TOPIC_CMD_VEL, rawVal);
      }
    }

    setInterval(() => {
      if (pendente !== null) {
        pausarSyncTemporariamente(850);
        enviarControle(pendente, true);
      }
    }, 150);

    function aplicarDigitadoPct() {
      if (isCalibrando) return;
      let v = parseInt(pctInput.value, 10);
      if (isNaN(v)) v = 0;
      v = Math.max(0, Math.min(100, v));
      pctInput.value = v;
      fader.value = v;
      enviarControle(v, true);
    }

    pctInput.addEventListener('focus', () => pausarSyncTemporariamente(1200));
    pctInput.addEventListener('keydown', (e) => {
      pausarSyncTemporariamente(1200);
      if (e.key === 'Enter') {
        e.preventDefault();
        aplicarDigitadoPct();
        pctInput.blur();
      }
    });
    pctInput.addEventListener('change', aplicarDigitadoPct);
    btnApplyPct.addEventListener('click', aplicarDigitadoPct);

    // Marca início e fim do toque/arraste no fader para não brigar com o retorno MQTT
    const iniciarArraste = () => {
      segurandoFader = true;
      pausarSyncTemporariamente(1000);
    };
    const finalizarArraste = (e) => {
      segurandoFader = false;
      pausarSyncTemporariamente(850);
      if (e && e.target) {
        enviarControle(e.target.value, true);
      }
    };

    fader.addEventListener('pointerdown', iniciarArraste);
    fader.addEventListener('touchstart', iniciarArraste, { passive: true });
    fader.addEventListener('mousedown', iniciarArraste);

    fader.addEventListener('pointerup', finalizarArraste);
    fader.addEventListener('touchend', finalizarArraste);
    fader.addEventListener('mouseup', finalizarArraste);
    fader.addEventListener('pointercancel', finalizarArraste);

    fader.addEventListener('input', (e) => {
      segurandoFader = true;
      enviarControle(e.target.value, false);
    });
    fader.addEventListener('change', (e) => {
      segurandoFader = false;
      enviarControle(e.target.value, true);
    });

    btnCal.addEventListener('click', () => {
      pausarSyncTemporariamente(1000);
      isCalibrando = !isCalibrando;
      publicar(TOPIC_CMD_CAL_MODE, isCalibrando ? "1" : "0");
      configurarEscalaFader();
    });

    btnSave.addEventListener('click', () => {
      pausarSyncTemporariamente(1000);
      const usAtual = parseInt(fader.value, 10) || 1200;
      publicar(TOPIC_CMD_CAL_SAVE, usAtual);
      partidaSalva.textContent = usAtual;
      statusMsg.textContent = "Partida enviada para salvar em " + usAtual + " µs!";
    });

    btnStop.addEventListener('click', () => {
      segurandoFader = false;
      pendente = null;
      pausarSyncTemporariamente(900);
      if (isCalibrando) {
        atualizarVisual(1000, true);
        publicar(TOPIC_CMD_CAL_SET, 1000);
      } else {
        pctInput.value = 0;
        atualizarVisual(0, true);
        publicar(TOPIC_CMD_VEL, 0);
      }
    });
  </script>
</body>
</html>
